name: opencode-review

# Reviews each PR with opencode on a free Zen model. The workflow, its model and its
# permissions live in TakashiAihara/opencode-review; @main follows changes made there.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  opencode:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: TakashiAihara/opencode-review/.github/workflows/review.yml@main
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
